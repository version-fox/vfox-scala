name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces the run of the push before it. Every
  # commit on main gets a group of its own instead, so a newer commit does not
  # cancel the run of an older one.
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Linux job builds the image from tests/e2e/linux and runs the suite with
# the runner's Docker, so every group of checks starts in a new container. The
# Windows job runs the suite on the host, with vfox.exe from its release. See
# docs/e2e.md.

jobs:
  e2e-linux:
    if: github.repository == 'version-fox/vfox-scala'
    name: Linux container (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - run: go test -v -timeout 55m -run TestE2E ./linux
        working-directory: tests/e2e

  e2e-windows:
    if: github.repository == 'version-fox/vfox-scala'
    name: Windows host (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      # The suite runs the Scala launchers, which need a JDK on the PATH.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: go test -v -timeout 55m -run TestE2E ./windows
        working-directory: tests/e2e
